name: Deploy web frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      # The site ships the package inside its engine bundle.
      - 'src/**'
      - 'tools/build_web_engine.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # SEO: the sitemap is generated at deploy time, never committed, so its
      # lastmod is always the date the live site actually changed. Submitted
      # once in Google Search Console as
      # https://dfieser.github.io/hea-bench/sitemap.xml — nothing to maintain.
      - name: Generate sitemap.xml stamped with the deploy date
        run: |
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo '  <url>'
            echo '    <loc>https://dfieser.github.io/hea-bench/</loc>'
            echo "    <lastmod>$(date -u +%Y-%m-%d)</lastmod>"
            echo '  </url>'
            echo '</urlset>'
          } > web/sitemap.xml
          cat web/sitemap.xml
      # The engine (web/engine/: the Pyodide runtime, numpy, scipy and
      # scikit-learn wheels, and the hea-bench package zip) is gitignored
      # and assembled here, so the Dataset, Design and Benchmark tabs and
      # the predictions panel work on the live site. Every file is SHA-256
      # pinned in the build script; verify-live in auto-release.yml checks
      # that the live engine reports the released version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore the pinned Pyodide runtime
        uses: actions/cache@v6
        with:
          path: web/engine/pyodide
          key: pyodide-${{ hashFiles('tools/build_web_engine.py') }}
      - name: Assemble the in-app engine bundle
        run: python tools/build_web_engine.py
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload web/ as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
