name: Desktop smoke

# Builds the portable exe from any branch and uses every tab inside it,
# the same steps as the desktop-build job in release.yml, without
# releasing anything. Run it to check an exe fix before the next push to
# main cuts a release:
#
#   gh workflow run desktop-smoke.yml --ref main
#   gh run watch "$(gh run list --workflow desktop-smoke.yml --limit 1 --json databaseId --jq '.[0].databaseId')"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore the pinned Pyodide runtime
        uses: actions/cache@v6
        with:
          path: web/engine/pyodide
          key: pyodide-${{ hashFiles('tools/build_web_engine.py') }}
      - name: Assemble the in-app engine bundle
        run: python tools/build_web_engine.py
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build the portable executable (no installer)
        run: cargo tauri build --no-bundle
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Restore the pinned Peivaste snapshot
        uses: actions/cache@v6
        with:
          path: data/raw/peivaste/dataset11252_79.csv
          key: peivaste-655a43e521003f5c8973050b5f7c0a5d4b9ab902ca4ecc9c8a7d9813b2b0ba10
      - name: Fetch the Peivaste snapshot (verifies the pinned SHA-256 either way)
        run: python data/raw/peivaste/fetch.py
      - name: Make sure the WebView2 runtime is installed (the exe renders in it)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if ($pv -and $pv -ne '0.0.0.0') { "WebView2 runtime $pv is installed"; exit 0 }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2-setup.exe"
          Start-Process "$env:RUNNER_TEMP\webview2-setup.exe" -ArgumentList '/silent', '/install' -Wait
          $pv = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $pv -or $pv -eq '0.0.0.0') { throw 'the WebView2 runtime did not install' }
          "WebView2 runtime $pv installed"
      # Diagnostic only, while the exe smoke fails on GitHub's runners
      # (issue #4): launches the exe with the DevTools port passed three
      # ways and prints the browser's full command line, its listening
      # sockets, the Edge policies and a screenshot of the desktop.
      - name: Probe the exe's DevTools port
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "$PWD\src-tauri\target\release\hea-bench.exe"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\probe-shots" | Out-Null
          "--- session: $(whoami), interactive $([Environment]::UserInteractive), session id $((Get-Process -Id $PID).SessionId)"
          "--- Edge and WebView2 policies"
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge') {
            if (Test-Path $k) {
              Get-ChildItem $k -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
              Get-ItemProperty $k | Format-List | Out-String -Width 400
            } else { "$k absent" }
          }
          $policy = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          function Probe([string]$name, [string]$browserArgs, [int]$port, [switch]$ViaPolicy) {
            $udf = "$env:RUNNER_TEMP\probe-$name"
            if ($ViaPolicy) {
              New-Item -Path $policy -Force | Out-Null
              New-ItemProperty -Path $policy -Name 'hea-bench.exe' -Value $browserArgs -Force | Out-Null
              Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -ErrorAction SilentlyContinue
            } else { $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = $browserArgs }
            $env:WEBVIEW2_USER_DATA_FOLDER = $udf
            $app = Start-Process -FilePath $exe -PassThru
            $open = $false
            for ($i = 1; $i -le 40; $i++) {
              Start-Sleep -Seconds 1
              if ($port -gt 0) {
                try { Invoke-RestMethod "http://127.0.0.1:$port/json/version" -TimeoutSec 2 | Out-Null; $open = $true; break } catch {}
              }
              if ($app.HasExited) { break }
            }
            "=== ${name}: port $port open $open after $i s, exe exited $($app.HasExited)"
            $app.Refresh()
            "  window title '$($app.MainWindowTitle)', responding $($app.Responding)"
            $procs = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object { $_.CommandLine -like "*probe-$name*" })
            $procs | Where-Object { $_.CommandLine -notlike '*--type=*' } | ForEach-Object { "  browser: $($_.CommandLine)" }
            "  webview processes: $($procs.Count)"
            $ids = @($procs.ProcessId)
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess } |
              ForEach-Object { "  listening: $($_.LocalAddress):$($_.LocalPort)" }
            Get-ChildItem $udf -Recurse -Filter DevToolsActivePort -ErrorAction SilentlyContinue |
              ForEach-Object { "  DevToolsActivePort: $((Get-Content $_.FullName) -join ' ')" }
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $shot = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
              [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $shot.Save("$env:RUNNER_TEMP\probe-shots\$name.png")
            } catch { "  no screenshot: $_" }
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Remove-Item -Path $policy -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, Env:WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          Probe 'env' '--remote-debugging-port=9311' 9311
          Probe 'env-port0' '--remote-debugging-port=0' 0
          Probe 'policy' '--remote-debugging-port=9313' 9313 -ViaPolicy
          "--- updating the WebView2 runtime to the newest release"
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2-setup.exe"
          Start-Process "$env:RUNNER_TEMP\webview2-setup.exe" -ArgumentList '/silent', '/install' -Wait
          "WebView2 runtime now $((Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv)"
          Probe 'env-updated' '--remote-debugging-port=9314' 9314
      - name: Keep the probe screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-shots
          path: ${{ runner.temp }}/probe-shots
          if-no-files-found: ignore
      - name: Use every tab inside the built exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          $env:HEA_BENCH_DESKTOP_EXE = "$PWD\src-tauri\target\release\hea-bench.exe"
          $env:HEA_BENCH_REQUIRE_ENGINE = "1"   # a skip is a failure here
          python -m pytest tests/test_desktop_smoke.py -q -rs -p no:cacheprovider
