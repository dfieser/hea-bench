name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # let release.yml reuse this test matrix as a release gate

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Every version-bearing file must agree with the canonical __version__
        run: python tools/version.py --check

  benchmark-freeze:
    # The frozen split digests live in src/hea_bench/benchmark/frozen.py
    # (hash-pinned by tests/test_benchmark_corpus.py), checked by those tests,
    # but those tests skip wherever the corpus is absent, and the corpus
    # cannot be committed: its largest source declares no license, so only
    # the recipe ships (see data/raw/README.md). This job runs the recipe —
    # fetch the pinned upstream snapshot, rebuild the corpus, check the
    # digests — so the freeze is enforced by machinery rather than by
    # whoever happens to have the data locally.
    #
    # Two distinct failure modes, both of which SHOULD go red:
    #   - fetch.py exits 2: upstream bytes changed, the recipe no longer
    #     reproduces the frozen corpus;
    #   - the digest tests fail: the corpus or the split algorithm drifted.
    # Via the workflow_call gate in release.yml, either also blocks a
    # release, which is deliberate: the reproducibility claim would be
    # false.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore the pinned Peivaste snapshot
        uses: actions/cache@v6
        with:
          path: data/raw/peivaste/dataset11252_79.csv
          # Keyed by the pinned SHA-256 in fetch.py, so a deliberate re-pin
          # naturally invalidates the cache.
          key: peivaste-655a43e521003f5c8973050b5f7c0a5d4b9ab902ca4ecc9c8a7d9813b2b0ba10
      - name: Fetch the Peivaste snapshot (verifies the pinned SHA-256 either way)
        run: python data/raw/peivaste/fetch.py
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Rebuild the consolidated corpus from the recipe
        run: python -m hea_bench.benchmark.consolidate
      - name: Verify the frozen split digests and corpus statistics
        run: pytest tests/test_benchmark_corpus.py tests/test_benchmark_splits.py -q

  web-engine:
    # The app runs the real hea_bench package in the browser (Pyodide, see
    # web/hea-engine-worker.js). This job assembles the exact engine bundle
    # the site and the desktop exe ship (tools/build_web_engine.py, every
    # file SHA-256 pinned), rebuilds the corpus, and proves that the bundle,
    # run under Node, answers every bridge call in
    # tests/data/web_engine_calls.json exactly as CPython does, plus the
    # corpus-backed bridge tests and the four-part parity registry. Last, it opens
    # the built site in headless Chrome (preinstalled on the runner) and
    # uses every tab the way a person does (tests/test_app_smoke.py).
    # HEA_BENCH_REQUIRE_ENGINE=1 turns every skip into a failure, so a
    # missing piece cannot pass silently. Via the workflow_call gate in
    # release.yml it also blocks a release whose app would be broken.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # the version the engine harness was verified on
      - name: Restore the pinned Peivaste snapshot
        uses: actions/cache@v6
        with:
          path: data/raw/peivaste/dataset11252_79.csv
          key: peivaste-655a43e521003f5c8973050b5f7c0a5d4b9ab902ca4ecc9c8a7d9813b2b0ba10
      - name: Fetch the Peivaste snapshot (verifies the pinned SHA-256 either way)
        run: python data/raw/peivaste/fetch.py
      - name: Restore the pinned Pyodide runtime
        uses: actions/cache@v6
        with:
          path: web/engine/pyodide
          # The pins live in the build script, so editing them re-downloads.
          key: pyodide-${{ hashFiles('tools/build_web_engine.py') }}
      - name: Install package with dev and benchmark extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,benchmark]"
      - name: Rebuild the consolidated corpus from the recipe
        run: python -m hea_bench.benchmark.consolidate
      - name: Assemble the in-app engine bundle
        run: python tools/build_web_engine.py
      - name: The app computes what the library computes, and every tab works in a browser
        env:
          HEA_BENCH_REQUIRE_ENGINE: "1"
        run: pytest tests/test_web_engine.py tests/test_webapp.py tests/test_feature_parity.py tests/test_app_smoke.py -q

  package:
    # Every other job imports the package from this checkout, where the
    # data files sit in data/ and docs/. PyPI users get the wheel. This
    # builds the sdist and the wheel, checks what they ship (the data,
    # never the unlicensed Peivaste file), installs the wheel with its mcp
    # extra in a fresh virtual environment, and from an empty per-user
    # data folder calls every MCP tool over real stdio through the
    # installed hea-bench-mcp command, then uses the library
    # (tests/package_smoke.py). Via the workflow_call gate in release.yml
    # it blocks a release whose PyPI package or MCP server would be broken.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore the pinned Peivaste snapshot
        uses: actions/cache@v6
        with:
          path: data/raw/peivaste/dataset11252_79.csv
          key: peivaste-655a43e521003f5c8973050b5f7c0a5d4b9ab902ca4ecc9c8a7d9813b2b0ba10
      - name: Fetch the Peivaste snapshot (verifies the pinned SHA-256 either way)
        run: python data/raw/peivaste/fetch.py
      - name: Install the build and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build, install fresh, and use every feature from the wheel
        env:
          HEA_BENCH_PACKAGE_SMOKE: "1"
        run: pytest tests/test_installed_package.py -q

  interop:
    # The HEACalculator backend adapter is exercised against a real
    # install of the pinned series, so a schema change on their side is
    # caught here rather than by a user. The core test job below stays
    # extras-free on purpose: it is the proof the bare package works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with dev and interop extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,interop]"
      - name: Run the backend and CLI suites against the installed HEACalculator
        run: pytest tests/test_descriptor_backend.py tests/test_cli.py -q

  test-extras:
    # scikit-learn-backed layers (conformal integration, property
    # surrogates) only exercise their sklearn paths where the pinned
    # version is installed, and the MCP server tests that build the real
    # server need the MCP SDK; this job provides both. The plain test job
    # stays extras-free as the bare-package proof.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with dev, benchmark and mcp extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,benchmark,mcp]"
      - name: Run the full suite with scikit-learn and the MCP SDK available
        run: pytest tests/ -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Validate publish metadata (external registry limits)
        # External publishers (the MCP registry) enforce constraints no
        # test would otherwise see; tools/preflight.py encodes every one
        # that has bitten. Runs here AND in the release bot before it
        # tags, so invalid metadata can never reach a publish step.
        run: python tools/preflight.py --metadata

      - name: Run test suite
        run: pytest tests/ -q
        # Node is installed so the Python<->JS parity test
        # (tests/test_web_parity.py) can run the browser calculator core
        # and assert it matches the Python library on every binary pair
        # and the canonical multi-element fixtures.
