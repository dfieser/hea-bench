name: Release

# One tag-driven, fully hands-off release pipeline. Cutting a release is:
#
#   python tools/version.py --set X.Y.Z
#   (write the CHANGELOG.md section + the web/index.html VERSION_HISTORY entry)
#   git commit -am "Release vX.Y.Z"
#   git tag vX.Y.Z && git push --follow-tags
#
# Job graph (--> = "needs"):
#   guard ----.
#   gate  ----+--> pypi --> mcp                 (mcp publishes the registry)
#             |        `--> release             (creates the Release; fires Zenodo)
#             `--> desktop-build                (compiles the exe in parallel)
#   desktop-attach <-- (desktop-build, release) (uploads the exe to the Release)
#
# The Release (and therefore the Zenodo DOI) depends ONLY on PyPI, so a flaky
# MCP-registry publish never blocks archival. The slow Windows build runs in
# parallel with pypi/mcp and only its tiny upload waits for the Release.
#
# See RELEASING.md for the one-time setup (PyPI Trusted Publisher + the `pypi`
# environment) and the full runbook.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Refuse a run that is not from a vX.Y.Z tag. workflow_dispatch defaults to a
  # branch ref, from which every job would derive a bogus version; fail fast
  # with a clear message instead.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only release from a vX.Y.Z tag
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Run release.yml from a vX.Y.Z tag ref, not ${GITHUB_REF_NAME}."
            exit 1
          fi

  # The whole CI workflow on the tagged commit: the pytest 3.10-3.14 matrix,
  # JS parity, the in-app engine and browser smoke test, the installed-wheel
  # and MCP stdio test, and the version-consistency drift check.
  gate:
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: [guard, gate]
    runs-on: ubuntu-latest
    environment: pypi        # must match the PyPI trusted-publisher config
    permissions:
      id-token: write        # OIDC mints a short-lived token; no PYPI_API_TOKEN
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Built artifacts must match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls "dist/hea_bench-${v}.tar.gz" "dist/hea_bench-${v}-py3-none-any.whl"
      - name: Publish to PyPI (Trusted Publishing, no username/password)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Keep the built artifacts for the GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Runs in parallel with `release`; a registry hiccup here does NOT block the
  # GitHub Release or the Zenodo DOI.
  mcp:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # OIDC login to the MCP registry (no secret)
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Wait until PyPI serves this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl -fsSL "https://pypi.org/pypi/hea-bench/${v}/json" >/dev/null; then
              echo "PyPI is serving ${v}"; exit 0
            fi
            echo "waiting for PyPI to serve ${v} (attempt $i)"; sleep 10
          done
          echo "PyPI did not serve ${v} within 5 minutes"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to the MCP registry
        run: ./mcp-publisher publish

  # Compiles the exe in parallel with pypi/mcp; only the attach step below waits
  # for the Release to exist.
  desktop-build:
    needs: [guard, gate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      # The exe embeds web/, including the gitignored in-app engine
      # (web/engine/), so the engine is assembled before Tauri bundles the
      # folder. Without it the desktop app's Dataset, Design and Benchmark
      # tabs and the predictions panel would not start.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore the pinned Pyodide runtime
        uses: actions/cache@v6
        with:
          path: web/engine/pyodide
          key: pyodide-${{ hashFiles('tools/build_web_engine.py') }}
      - name: Assemble the in-app engine bundle
        run: python tools/build_web_engine.py
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build the portable executable (no installer)
        run: cargo tauri build --no-bundle
      # The built exe goes through every tab before it can be attached: the
      # same steps as the site's headless-browser smoke test, run inside the
      # exe itself (tests/test_desktop_smoke.py), engine and dataset build
      # included. A failure fails this job, so desktop-failed opens the
      # desktop-build issue and no broken exe reaches the release.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # the version the smoke driver was verified on
      - name: Restore the pinned Peivaste snapshot
        uses: actions/cache@v6
        with:
          path: data/raw/peivaste/dataset11252_79.csv
          key: peivaste-655a43e521003f5c8973050b5f7c0a5d4b9ab902ca4ecc9c8a7d9813b2b0ba10
      - name: Fetch the Peivaste snapshot (verifies the pinned SHA-256 either way)
        run: python data/raw/peivaste/fetch.py
      - name: Make sure the WebView2 runtime is installed (the exe renders in it)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if ($pv -and $pv -ne '0.0.0.0') { "WebView2 runtime $pv is installed"; exit 0 }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2-setup.exe"
          Start-Process "$env:RUNNER_TEMP\webview2-setup.exe" -ArgumentList '/silent', '/install' -Wait
          $pv = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $pv -or $pv -eq '0.0.0.0') { throw 'the WebView2 runtime did not install' }
          "WebView2 runtime $pv installed"
      - name: Use every tab inside the built exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          $env:HEA_BENCH_DESKTOP_EXE = "$PWD\src-tauri\target\release\hea-bench.exe"
          $env:HEA_BENCH_REQUIRE_ENGINE = "1"   # a skip is a failure here
          python -m pytest tests/test_desktop_smoke.py -q -rs -p no:cacheprovider
      - name: Stage the portable exe
        shell: pwsh
        run: Copy-Item "src-tauri/target/release/hea-bench.exe" "HEA-Bench.exe"
      - name: Keep the exe for the attach step
        uses: actions/upload-artifact@v7
        with:
          name: desktop
          path: HEA-Bench.exe

  # Depends only on PyPI: a GitHub Release does not need the MCP registry.
  # Creating the Release fires the GitHub<->Zenodo integration.
  release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the Release and upload assets
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the built artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Extract this version's changelog section as release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v ver="$v" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "No '## [${v}]' changelog section found; falling back to generated notes." >&2
            echo "Release ${GITHUB_REF_NAME}." > NOTES.md
          fi
          echo "--- release notes ---"; cat NOTES.md
      - name: Create the GitHub Release (fires the Zenodo webhook)
        uses: softprops/action-gh-release@v3
        with:
          body_path: NOTES.md
          generate_release_notes: true
          files: dist/*

  # Attach the exe once both the parallel build and the Release exist.
  desktop-attach:
    needs: [desktop-build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload the exe asset to this tag's release
    steps:
      - name: Fetch the built exe
        uses: actions/download-artifact@v8
        with:
          name: desktop
      - name: Attach the portable exe to this tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        # --repo is required because this job does not check out the repo, so gh
        # cannot infer the target from a local git remote.
        run: gh release upload "${GITHUB_REF_NAME}" HEA-Bench.exe --clobber --repo "${{ github.repository }}"

  # Nobody waits for the desktop exe: it is a 15-20 minute Rust build, and
  # verify-release in auto-release.yml finishes as soon as PyPI, the MCP
  # registry and the GitHub Release are green. A failure here would
  # therefore be silent. This job opens an issue (or comments on the open
  # one) that mentions and assigns the owner, which GitHub delivers by
  # email with no SMTP secret to keep. It runs only when one of the two
  # desktop jobs actually failed, not when they were skipped because an
  # upstream surface failed first; that case is already red in the watch.
  desktop-failed:
    needs: [desktop-build, desktop-attach]
    if: always() && (needs.desktop-build.result == 'failure' || needs.desktop-attach.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the desktop-build issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: dfieser
          BUILD_RESULT: ${{ needs.desktop-build.result }}
        run: |
          tag="${GITHUB_REF_NAME}"
          run_url="https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}"
          failed="desktop-build"
          if [ "$BUILD_RESULT" = "success" ]; then failed="desktop-attach"; fi
          gh label create desktop-build --repo "$GH_REPO" --color 8b3a2f --force \
            --description "The Windows exe did not build or attach to a release"
          body=$(printf '%s\n' \
            "@${OWNER} the Windows executable for **${tag}** did not ship: job \`${failed}\` failed." \
            "" \
            "Run: ${run_url}" \
            "" \
            "PyPI, the MCP registry, the GitHub Release and the site are unaffected; only the exe asset is missing from the ${tag} release, and the site's download link shows its update-in-progress notice until one is attached. If the failure was transient (a runner, the network), re-fire just this pipeline:" \
            "" \
            "    gh workflow run release.yml --ref ${tag}" \
            "" \
            "A re-fire builds the code at ${tag}, so it cannot pick up a fix. If the cause was in the code, the tests or the workflow, fix it on main with [no-release], confirm it with a green run of" \
            "" \
            "    gh workflow run desktop-smoke.yml --ref main" \
            "" \
            "and the next releasing push ships the exe. Close this issue once an exe is attached.")
          existing=$(gh issue list --repo "$GH_REPO" --label desktop-build --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
            echo "commented on open issue #${existing}"
          else
            gh issue create --repo "$GH_REPO" --title "Desktop exe failed to ship for ${tag}" \
              --body "$body" --label desktop-build --assignee "$OWNER"
          fi
