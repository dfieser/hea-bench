[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hea-bench"
dynamic = ["version"]
description = "An open, interpretable calculator of high-entropy-alloy and high-entropy-oxide thermodynamic and geometric descriptors plus the canonical empirical phase-prediction rules."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "David Fieser", email = "dfieser9@gmail.com" },
    # ORCID: https://orcid.org/0009-0007-5754-4331
]
keywords = [
    "high-entropy alloys",
    "high-entropy oxides",
    "thermodynamic descriptors",
    "Miedema model",
    "materials informatics",
    "phase-prediction rules",
    "alloy design",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# The descriptor + rule core is intentionally dependency-free: every
# quantity is computed with the standard library over vendored data tables.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Pinned to the 0.15 series: CI installs this fresh, and a new ruff
    # minor can expand the default rule set overnight and fail the
    # release gate on untouched code (it did, 2026-07-24). Bump the pin
    # deliberately, together with any new-rule cleanups.
    "ruff~=0.15.0",
    # tests/test_installed_package.py builds the sdist and the wheel.
    "build>=1.2",
]
# The MCP server (hea-bench-mcp) has every feature of the package, so its
# extra brings everything those features need: the official MCP SDK and
# scikit-learn for the fitted models (phase sets, hardness, the benchmark
# baselines, campaigns). The calculator core itself stays dependency-free.
# The server is built on mcp 2 (mcp.server.mcpserver); 1.x lacks it and
# a future 3.x may move it again, hence both bounds.
mcp = [
    "mcp>=2.3,<3",
    "scikit-learn~=1.7.2",
]
# The benchmark subpackage itself (splits, metrics, load_benchmark,
# evaluate) is standard-library only, like the core. This extra is for
# the fitted baselines in tools/benchmark_baselines.py. Pinned to the
# 1.7 series because the numbers in docs/benchmark-baselines.md were
# produced with scikit-learn 1.7.2, and tree ensembles can shift a few
# thousandths across minors; regenerate the table when bumping the pin.
benchmark = [
    "scikit-learn~=1.7.2",
]
# Optional descriptor-backend interop with HEACalculator (Sariturk et
# al., GPLv3). The adapter in hea_bench.descriptors.backend targets the
# 2.0 get_dict schema. Pinned to the series docs/backend-agreement.md
# was generated with: their 2.1.0 and 2.2.0 changed the bundled
# reference data, and the old ~=2.0, which admits any 2.x, let CI
# install 2.2.0 and fail the v2.6.0 release gate (2026-10-05).
# tests/test_descriptor_backend.py fails if this pin admits any other
# minor series. Moving to a newer series means regenerating that
# document against it first. Installing this extra is the user's
# choice; hea-bench ships none of HEACalculator's code and remains MIT.
interop = [
    "HEACalculator~=2.0.1",
]
# Tier B property surrogates (hea_bench.properties). Same pin and same
# reason as the benchmark extra: the model-card numbers in
# docs/property-hardness.md were produced with scikit-learn 1.7.2, and
# tree ensembles can shift across minors; regenerate the cards when
# bumping.
properties = [
    "scikit-learn~=1.7.2",
]
# Everything a user can use, in one install: pip install "hea-bench[all]".
# The HEACalculator interop stays separate (GPLv3, the user's choice).
all = [
    "mcp>=2.3,<3",
    "scikit-learn~=1.7.2",
]

[project.scripts]
hea-bench = "hea_bench.cli:main"
hea-bench-mcp = "hea_bench.mcp_server:main"

[project.urls]
Homepage = "https://dfieser.github.io/hea-bench/"
Repository = "https://github.com/dfieser/hea-bench"
Issues = "https://github.com/dfieser/hea-bench/issues"
Paper = "https://doi.org/10.3390/ma19143075"
Archive = "https://doi.org/10.5281/zenodo.20346287"

# The sdist must not sweep in the Tauri Rust build cache
# (src-tauri/target, hundreds of MB) or the vendored web/mathjax assets.
# The single source of truth for the version: hatchling reads __version__
# from the package at build time, so the number is never duplicated here.
[tool.hatch.version]
path = "src/hea_bench/__init__.py"

# Restrict it to the Python package and its data, the tests, and the
# project metadata. pyproject.toml is always included by hatchling. The
# data files are the ones the wheel ships (below), because pip builds a
# wheel from this sdist.
[tool.hatch.build.targets.sdist]
include = [
    "src/hea_bench",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "llms.txt",
    "docs/benchmark-baselines.json",
    "data/raw/README.md",
    "data/raw/borg2020/MPEA_dataset.csv",
    "data/raw/borg2020/README.md",
    "data/raw/pei2020/pei2020_alloys_phases.csv",
    "data/raw/pei2020/README.md",
    "data/raw/chizhevskiy2026/database_of_HEAs.csv",
    "data/raw/chizhevskiy2026/README.md",
    "data/raw/chizhevskiy2026/UPSTREAM_README.md",
    "data/raw/peivaste/README.md",
    "data/raw/peivaste/dataset11252_79.csv",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hea_bench"]

# Ship the vendored Miedema data files inside the wheel so the
# pair-enthalpy and Miedema-parameter lookups work after a plain
# `pip install hea-bench` with no extra fetch step.
[tool.hatch.build.targets.wheel.force-include]
"src/hea_bench/descriptors/data/pair_enthalpies.tsv"     = "hea_bench/descriptors/data/pair_enthalpies.tsv"
"src/hea_bench/descriptors/data/miedema_parameters.csv"  = "hea_bench/descriptors/data/miedema_parameters.csv"
"src/hea_bench/descriptors/data/LICENSE.matminer.txt"    = "hea_bench/descriptors/data/LICENSE.matminer.txt"
"src/hea_bench/oxides/data/oxide_elements.json"          = "hea_bench/oxides/data/oxide_elements.json"
"src/hea_bench/oxides/data/LICENSE.pymatgen.txt"         = "hea_bench/oxides/data/LICENSE.pymatgen.txt"
# Every feature must work from a plain pip install (four-surface parity,
# hea-bench/CLAUDE.md), so the wheel carries every source dataset (all
# CC BY 4.0, each with its README naming the authors) and the published
# baseline table, under hea_bench/_data, where hea_bench/_paths.py looks
# first. tests/test_installed_package.py checks both distributions.
"docs/benchmark-baselines.json" = "hea_bench/_data/benchmark-baselines.json"
"data/raw/README.md" = "hea_bench/_data/raw/README.md"
"data/raw/borg2020/MPEA_dataset.csv" = "hea_bench/_data/raw/borg2020/MPEA_dataset.csv"
"data/raw/borg2020/README.md" = "hea_bench/_data/raw/borg2020/README.md"
"data/raw/pei2020/pei2020_alloys_phases.csv" = "hea_bench/_data/raw/pei2020/pei2020_alloys_phases.csv"
"data/raw/pei2020/README.md" = "hea_bench/_data/raw/pei2020/README.md"
"data/raw/chizhevskiy2026/database_of_HEAs.csv" = "hea_bench/_data/raw/chizhevskiy2026/database_of_HEAs.csv"
"data/raw/chizhevskiy2026/README.md" = "hea_bench/_data/raw/chizhevskiy2026/README.md"
"data/raw/chizhevskiy2026/UPSTREAM_README.md" = "hea_bench/_data/raw/chizhevskiy2026/UPSTREAM_README.md"
"data/raw/peivaste/README.md" = "hea_bench/_data/raw/peivaste/README.md"
"data/raw/peivaste/dataset11252_79.csv" = "hea_bench/_data/raw/peivaste/dataset11252_79.csv"

[tool.ruff]
line-length = 100
target-version = "py310"
# examples/ are Jupytext notebook sources with cell-local imports, and the
# figure script sets the matplotlib backend before importing pyplot. Both
# legitimately violate import-ordering rules and are not library code, so
# they are excluded from linting. The CI workflow lints only src and tests.
extend-exclude = ["examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
